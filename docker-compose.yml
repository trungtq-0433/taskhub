# Local development only. The database credentials below are this container's
# provisioning values, not application configuration — in every real
# environment the database is provisioned separately and hands the application
# a DATABASE_URL.
services:
  db:
    image: postgres:16-alpine
    container_name: taskhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
      POSTGRES_DB: taskhub
    ports:
      # Need a different host port? Put it in docker-compose.override.yml,
      # which compose reads automatically and git ignores.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U taskhub -d taskhub" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: accepts anything on 1025, shows it at http://localhost:8025.
  # No auth and no delivery, so it is for development only.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: taskhub-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Local cache for GET /tags. No auth and no persistence: development only.
  # The API runs without it too — leave REDIS_URL unset and nothing is cached.
  redis:
    image: redis:7-alpine
    container_name: taskhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://taskhub:taskhub@db:5432/taskhub
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

volumes:
  postgres_data:
